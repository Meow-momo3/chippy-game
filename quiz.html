<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#FB7299">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>雾漫二籍留存大拷问😈！</title>
<style>
  :root{
    --pink:#FB7299;
    --pink-deep:#E85C85;
    --pink-soft:#FFE4EC;
    --pink-bg:#FFF5F8;
    --blue:#00A1D6;
    --text:#18191C;
    --text-sub:#61666D;
    --line:#E3E5E7;
    --bg:#F6F7F8;
    --white:#fff;
    --green:#2AC864;
    --green-soft:#E8F8EE;
    --red:#F25D8E;
    --red-soft:#FFECF2;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"PingFang SC","HarmonyOS Sans SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow:hidden;
    height:100dvh;
  }
  #app{position:relative;width:100%;height:100dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;}
  /* B站风：顶部粉色装饰条 */
  #app::before{
    content:"";position:fixed;top:0;left:0;right:0;height:3px;z-index:100;
    background:linear-gradient(90deg,#FB7299 0%,#FF9DBB 50%,#FB7299 100%);
  }

  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;
    padding:0 0 env(safe-area-inset-bottom,0px);
    opacity:1;transition:opacity .25s ease;
    overflow-y:auto;
  }
  .screen.hidden{opacity:0;pointer-events:none;}

  /* ---------- 顶栏 ---------- */
  .topbar{
    width:100%;
    background:var(--white);
    border-bottom:1px solid #FFE1EB;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 16px 10px;
    display:flex;align-items:center;justify-content:space-between;gap:10px;
    flex:0 0 auto;
  }
  .topbar .title{font-size:15px;font-weight:700;color:var(--text);}
  .topbar .title .dot{color:var(--pink);}
  .pill{
    background:var(--pink-soft);color:var(--pink-deep);
    font-size:12px;font-weight:700;
    padding:5px 11px;border-radius:999px;white-space:nowrap;
  }
  .iconbtn{
    border:0;background:transparent;color:var(--text-sub);
    font-size:15px;font-family:inherit;font-weight:600;
    padding:6px 4px;cursor:pointer;display:flex;align-items:center;gap:4px;
  }

  /* ---------- 通用卡片/按钮 ---------- */
  .card{
    background:var(--white);border-radius:14px;
    box-shadow:0 2px 12px rgba(24,25,28,.06);
  }
  .btn{
    border:0;cursor:pointer;font-family:inherit;font-weight:700;
    border-radius:999px;font-size:16px;
    padding:14px 20px;width:100%;
    display:flex;align-items:center;justify-content:center;gap:8px;
    transition:transform .08s ease,filter .15s ease;
  }
  .btn:active{transform:scale(.985);filter:brightness(.97);}
  .btn.primary{background:var(--pink);color:#fff;box-shadow:0 6px 16px rgba(251,114,153,.34);}
  .btn.ghost{background:var(--white);color:var(--pink-deep);border:1.5px solid var(--pink-soft);}
  .btn:disabled{opacity:.45;cursor:default;box-shadow:none;}

  /* ---------- 首页 ---------- */
  #screen-home{justify-content:flex-start;padding-top:0;}
  .home-body{
    width:100%;max-width:520px;margin:0 auto;
    padding:18px 18px 28px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
  }
  /* 喵喵头像 + 作者署名 */

    box-shadow:0 8px 26px rgba(251,114,153,.30);
  }
  .hero-author{
    font-size:13px;font-weight:800;color:var(--pink-deep);
    background:var(--white);padding:6px 15px;border-radius:999px;
    border:1.5px solid #FFE4EC;
    box-shadow:0 2px 10px rgba(251,114,153,.14);
  }
  .banner{
    position:relative;width:100%;border-radius:16px;overflow:hidden;
    background:linear-gradient(135deg,#FFD3E0 0%,#FFE9F0 55%,#E9F6FF 100%);
    padding:15px 16px;text-align:center;
    box-shadow:0 4px 18px rgba(251,114,153,.16);
  }
  .banner h1{
    margin:0 0 5px;font-size:21px;font-weight:800;color:#C9476F;
    letter-spacing:.02em;line-height:1.3;
  }
  .banner p{margin:0;font-size:12px;color:#B85E7C;font-weight:600;}

  .stat-row{display:flex;gap:10px;width:100%;}
  .stat{
    flex:1;background:var(--white);border-radius:12px;padding:12px 10px;text-align:center;
    box-shadow:0 2px 10px rgba(24,25,28,.05);
  }
  .stat .k{font-size:11px;color:var(--text-sub);font-weight:600;}
  .stat .v{font-size:20px;font-weight:800;color:var(--pink-deep);margin-top:2px;}
  .stat .v .unit{font-size:12px;font-weight:700;color:var(--text-sub);}

  .scoreboard{width:100%;padding:4px 2px;}
  .scoreboard h3{
    margin:0 0 8px;font-size:13px;font-weight:700;color:var(--text-sub);
    display:flex;align-items:center;gap:6px;
  }
  .scoreboard h3::before{content:"";width:3px;height:13px;border-radius:2px;background:var(--pink);display:inline-block;}
  .score-list{display:flex;gap:10px;}
  .score-item{
    flex:1;background:var(--white);border-radius:12px;padding:12px 8px;text-align:center;
    box-shadow:0 2px 10px rgba(24,25,28,.05);border:1.5px solid transparent;
  }
  .score-item.done{border-color:var(--pink-soft);background:linear-gradient(180deg,#fff, #FFF8FA);}
  .score-item .lbl{font-size:11px;color:var(--text-sub);font-weight:700;}
  .score-item .num{font-size:22px;font-weight:800;color:var(--text);margin-top:3px;}
  .score-item.done .num{color:var(--pink-deep);}
  .score-item .num .of{font-size:12px;color:var(--text-sub);font-weight:700;}

  .note{font-size:11.5px;color:var(--text-sub);line-height:1.6;text-align:center;}

  /* ---------- 答题页 ---------- */
  #screen-quiz{justify-content:flex-start;}
  .quiz-head{
    width:100%;padding:14px 16px 12px;
    background:linear-gradient(180deg,#FFF4F8 0%,#FFFFFF 100%);
    border-bottom:1px solid #FFE1EB;flex:0 0 auto;
  }
  .quiz-head .row{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
  .quiz-head .qn{font-size:13px;font-weight:700;color:var(--text-sub);}
  .quiz-head .qn b{color:var(--pink);font-size:17px;}
  .quiz-head .sc{font-size:13px;font-weight:700;color:var(--text-sub);}
  .quiz-head .sc b{color:var(--pink-deep);font-size:17px;}
  .bar{height:8px;border-radius:4px;background:#FFEDF3;overflow:hidden;}
  .bar > i{display:block;height:100%;width:0;border-radius:4px;
    background:linear-gradient(90deg,#FF9DBB,var(--pink));transition:width .3s ease;}

  .quiz-body{width:100%;max-width:640px;margin:0 auto;padding:16px 16px 24px;flex:1 0 auto;display:flex;flex-direction:column;gap:14px;}
  .qcard{
    position:relative;
    background:var(--white);border-radius:14px;padding:18px 16px 18px 20px;
    box-shadow:0 2px 12px rgba(24,25,28,.06);
    display:flex;gap:12px;align-items:flex-start;
    overflow:hidden;
  }
  .qcard::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;
    background:linear-gradient(180deg,#FF9DBB,var(--pink));
  }
  .qcard .avatar{
    width:54px;height:54px;flex:0 0 54px;border-radius:50%;
    background:linear-gradient(135deg,#FFE7F0,#FFF7FA);
    border:2px solid #FFD3E0;
    display:flex;align-items:center;justify-content:center;
    font-size:28px;line-height:1;
    transition:transform .18s ease;
  }
  .qcard .avatar.pop{transform:scale(1.14);}
  .qcard .qtext{font-size:16.5px;line-height:1.6;font-weight:600;color:var(--text);}
  .qcard .qtag{font-size:11px;color:var(--pink);font-weight:700;margin-bottom:5px;}

  .opts{display:flex;flex-direction:column;gap:10px;}
  .opt{
    border:1.5px solid var(--line);background:var(--white);
    border-radius:12px;padding:14px 14px;
    display:flex;align-items:center;gap:12px;
    font-family:inherit;font-size:15.5px;line-height:1.5;text-align:left;
    color:var(--text);cursor:pointer;font-weight:600;
    transition:border-color .15s ease,background .15s ease,transform .08s ease;
  }
  .opt:active{transform:scale(.99);}
  .opt .badge{
    width:28px;height:28px;flex:0 0 28px;border-radius:50%;
    background:var(--pink-soft);color:var(--pink-deep);
    display:flex;align-items:center;justify-content:center;
    font-size:13px;font-weight:800;
  }
  .opt .txt{flex:1;min-width:0;}
  .opt:hover{border-color:var(--pink-soft);}
  .opt.correct{border-color:var(--green);background:var(--green-soft);}
  .opt.correct .badge{background:var(--green);color:#fff;}
  .opt.wrong{border-color:var(--red);background:var(--red-soft);}
  .opt.wrong .badge{background:var(--red);color:#fff;}
  .opt.locked{pointer-events:none;}
  .opt.dim{opacity:.55;}

  .feedback{
    display:flex;align-items:center;gap:10px;
    background:var(--white);border-radius:12px;padding:12px 14px;
    box-shadow:0 2px 12px rgba(24,25,28,.06);
    font-size:13.5px;font-weight:700;
    opacity:0;transform:translateY(6px);transition:opacity .2s,transform .2s;
  }
  .feedback.show{opacity:1;transform:none;}
  .feedback .fi{font-size:20px;line-height:1;}
  .feedback.ok{color:#1F9E52;}
  .feedback.no{color:#D9446F;}
  .feedback .sub{display:block;font-size:12px;font-weight:600;color:var(--text-sub);margin-top:3px;}

  /* ---------- 结算 ---------- */
  #screen-result{justify-content:flex-start;}
  .result-body{width:100%;max-width:520px;margin:0 auto;padding:16px 18px 30px;display:flex;flex-direction:column;align-items:center;gap:14px;}
  .score-hero{
    width:100%;background:linear-gradient(135deg,#FFD3E0 0%,#FFEAF1 60%,#EAF7FF 100%);
    border-radius:18px;padding:20px 16px;text-align:center;
    box-shadow:0 6px 22px rgba(251,114,153,.18);
  }
  .score-hero .avatar{
    width:86px;height:86px;border-radius:50%;margin:0 auto 10px;
    background:linear-gradient(135deg,#FFE0EB,#FFF3F8);
    border:3px solid #fff;box-shadow:0 4px 14px rgba(232,92,133,.22);
    display:flex;align-items:center;justify-content:center;
    font-size:46px;line-height:1;
  }
  .score-hero .big{font-size:44px;font-weight:900;color:#C9476F;line-height:1;letter-spacing:-.02em;}
  .score-hero .big .of{font-size:17px;font-weight:800;color:#B85E7C;}
  .score-hero .cap{font-size:14px;font-weight:800;color:#C9476F;margin-top:8px;}
  .score-hero .sub{font-size:12px;color:#B85E7C;font-weight:600;margin-top:3px;}

  .final-total{
    width:100%;background:var(--white);border-radius:14px;padding:14px;
    box-shadow:0 2px 12px rgba(24,25,28,.06);
    display:flex;gap:10px;text-align:center;
  }
  .final-total > div{flex:1;}
  .final-total .k{font-size:11px;color:var(--text-sub);font-weight:700;}
  .final-total .v{font-size:22px;font-weight:800;color:var(--pink-deep);margin-top:2px;}
  .final-total .v .of{font-size:12px;color:var(--text-sub);}

  .btns{width:100%;display:flex;flex-direction:column;gap:10px;margin-top:2px;}

  .toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,12px);
    background:rgba(24,25,28,.86);color:#fff;font-size:13px;font-weight:600;
    padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;
    transition:opacity .25s,transform .25s;z-index:80;white-space:nowrap;
  }
  .toast.show{opacity:1;transform:translate(-50%,0);}
</style>
</head>

<div id="app">

  <!-- ================= 首页 ================= -->
  <section id="screen-home" class="screen">
    <div class="topbar">
      <div class="title">雾漫二籍留存大拷问<span class="dot">😈</span></div>
      <button class="iconbtn" id="btn-howto-home">玩法</button>
    </div>
    <div class="home-body">
      <div class="hero">
        <div class="hero-avatar"></div>
        <div class="hero-author">网站作者：Meow🍑Momo</div>
      </div>

      <div class="banner">

      <div class="stat-row">
        <div class="stat"><div class="k">剩余机会</div><div class="v"><span id="stat-left">3</span><span class="unit"> 次</span></div></div>
        <div class="stat"><div class="k">每轮题数</div><div class="v"><span id="stat-total">10</span><span class="unit"> 题</span></div></div>
        <div class="stat"><div class="k">题库总量</div><div class="v"><span id="stat-pool">0</span><span class="unit"> 题</span></div></div>
      </div>

      <div class="scoreboard">
        <h3>成绩记录</h3>
        <div class="score-list" id="home-scores"></div>
      </div>

      <div class="btns">
        <button class="btn primary" id="btn-start">开始答题</button>
        <button class="btn ghost" id="btn-reset">重置全部记录</button>
      </div>

      <div class="note">每轮从题库随机抽 10 题，<b>三轮题目互不重复</b>。<br>答完立刻出成绩，三次成绩都会记录在上面。</div>
    </div>
  </section>

  <!-- ================= 答题 ================= -->
  <section id="screen-quiz" class="screen hidden">
    <div class="topbar">
      <button class="iconbtn" id="btn-quit">‹ 退出</button>
      <div class="pill" id="quiz-attempt">第 1 次</div>
      <div style="width:52px"></div>
    </div>
    <div class="quiz-head">
      <div class="row">
        <div class="qn">第 <b id="q-idx">1</b> / <span id="q-total">10</span> 题</div>
        <div class="sc">得分 <b id="q-score">0</b></div>
      </div>
      <div class="bar"><i id="q-bar"></i></div>
    </div>
    <div class="quiz-body">
      <div class="qcard">

const PER_ROUND = 10;
const MAX_ATTEMPTS = 3;
const STORE_KEY = 'wuman-quiz-v1';

/* ================= 状态 ================= */
const $ = s => document.querySelector(s);
let store = { attempts: [], used: [] };   // attempts: [{score}] ; used: 已出过的题号

function load(){
  try{
    const raw = localStorage.getItem(STORE_KEY);
    if(raw){
      const o = JSON.parse(raw);
      if(o && Array.isArray(o.attempts) && Array.isArray(o.used)){
        store = { attempts: o.attempts.slice(0,MAX_ATTEMPTS), used: o.used };
      }
    }
  }catch(e){}
}
function save(){
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){}
}

let round = null;   // { items:[{q,options,answers}], idx, score, answered }

/* ================= 工具 ================= */
function shuffle(a){
  const r = a.slice();
  for(let i=r.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [r[i],r[j]]=[r[j],r[i]]; }
  return r;
}
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(t._t); t._t = setTimeout(()=>t.classList.remove('show'), 1800);
}
function show(name){
  ['home','quiz','result'].forEach(k=>{
    $('#screen-'+k).classList.toggle('hidden', k!==name);
  });
  const el = $('#screen-'+name);
  if(el) el.scrollTop = 0;
}
function attemptsLeft(){ return Math.max(0, MAX_ATTEMPTS - store.attempts.length); }

/* ================= 抽题 ================= */
function buildRound(){
  let pool = QUESTIONS.map((_,i)=>i).filter(i=>!store.used.includes(i));
  // 题目不够就重置去重池（正常 139 题足够三轮 30 题）
  if(pool.length < PER_ROUND){ store.used = []; pool = QUESTIONS.map((_,i)=>i); }
  const picked = shuffle(pool).slice(0, PER_ROUND);
  const items = picked.map(qi=>{
    const q = QUESTIONS[qi];
    // 选项打乱；含"以上/都"类选项的题目保持原序
    const hasAll = q.options.some(o=>/以上|全都|都不是|都是/.test(o));
    let order = q.options.map((_,i)=>i);
    if(!hasAll) order = shuffle(order);
    return {
      qi,
      q: q.q,
      options: order.map(i=>q.options[i]),
      answers: order.map((orig,newIdx)=>({orig,newIdx}))
                    .filter(x=>q.answers.includes(x.orig))
                    .map(x=>x.newIdx),
      multi: q.answers.length > 1
    };
  });
  return { items, idx:0, score:0, answered:false };
}

/* ================= 首页渲染 ================= */
function renderHome(){
  $('#stat-left').textContent = attemptsLeft();
  $('#stat-total').textContent = PER_ROUND;
  $('#stat-pool').textContent = QUESTIONS.length;

  const box = $('#home-scores');
  box.innerHTML = '';
  for(let i=0;i<MAX_ATTEMPTS;i++){
    const a = store.attempts[i];
    const d = document.createElement('div');
    d.className = 'score-item' + (a ? ' done' : '');
    d.innerHTML = `<div class="lbl">第 ${i+1} 次</div>
      <div class="num">${a ? a.score : '—'}${a ? '<span class="of">/10</span>' : ''}</div>`;
    box.appendChild(d);
  }

  const left = attemptsLeft();
  const btn = $('#btn-start');
  if(left <= 0){
    btn.disabled = true; btn.textContent = '三次机会已用完';
  }else{
    btn.disabled = false;
    btn.textContent = store.attempts.length === 0 ? '开始答题' : `开始第 ${store.attempts.length+1} 次答题`;
  }
  $('#btn-reset').style.display = store.attempts.length ? 'flex' : 'none';
}

/* ================= 答题 ================= */
function startRound(){
  if(attemptsLeft() <= 0){ toast('三次机会已经用完啦～'); return; }
  round = buildRound();
  $('#quiz-attempt').textContent = `第 ${store.attempts.length+1} 次`;
  $('#q-total').textContent = PER_ROUND;
  $('#q-avatar').textContent = FACE.idle;
  show('quiz');
  renderQuestion();
}

function renderQuestion(){
  const it = round.items[round.idx];
  round.answered = false;

  $('#q-idx').textContent = round.idx + 1;
  $('#q-score').textContent = round.score;
  $('#q-bar').style.width = ((round.idx)/PER_ROUND*100) + '%';
  $('#q-tag').textContent = it.multi ? '多选题（可能不止一个正确答案）' : '单选题';
  $('#q-text').textContent = it.q;
  $('#q-avatar').textContent = FACE.idle;
  $('#q-avatar').classList.remove('pop');

  const fb = $('#q-feedback'); fb.classList.remove('show','ok','no');

  const box = $('#q-opts'); box.innerHTML = '';
  it.options.forEach((txt, i)=>{
    const b = document.createElement('button');
    b.className = 'opt';
    b.innerHTML = `<span class="badge">${'ABCDEF'[i]}</span><span class="txt"></span>`;
    b.querySelector('.txt').textContent = txt;
    b.addEventListener('click', ()=>choose(i, b));
    box.appendChild(b);
  });
}

function choose(i, btn){
  if(round.answered) return;
  round.answered = true;
  const it = round.items[round.idx];
  const correct = it.answers.includes(i);

  const opts = [...document.querySelectorAll('#q-opts .opt')];
  opts.forEach(o=>o.classList.add('locked'));
  opts.forEach((o, k)=>{
    if(it.answers.includes(k)) o.classList.add('correct');
    else if(k === i) o.classList.add('wrong');
    else o.classList.add('dim');
  });

  const fb = $('#q-feedback');
  const avatar = $('#q-avatar');
  if(correct){
    round.score++;
    $('#q-score').textContent = round.score;
    avatar.textContent = FACE.right;
    avatar.classList.add('pop');
    fb.className = 'feedback show ok';
    $('#q-fi').textContent = '✅';
    $('#q-fb-text').innerHTML = '答对啦！' + (it.multi ? '<span class="sub">（多选题答对一个选项即可得分）</span>' : '');
  }else{
    avatar.textContent = FACE.wrong;
    avatar.classList.add('pop');
    const right = it.answers.map(k=>'ABCDEF'[k]).join('、');
    fb.className = 'feedback show no';
    $('#q-fi').textContent = '❌';
    $('#q-fb-text').innerHTML = '答错了<span class="sub">正确答案：' + right + '</span>';
  }

  const delay = correct ? 1000 : 1900;
  clearTimeout(round._t);
  round._t = setTimeout(nextQuestion, delay);
}

function nextQuestion(){
  clearTimeout(round._t);
  if(round.idx + 1 >= PER_ROUND){ finishRound(); return; }
  round.idx++;
  renderQuestion();
}

function finishRound(){
  const score = round.score;
  // 记录本轮的题目（保证下一轮不重复）
  round.items.forEach(it=>{ if(!store.used.includes(it.qi)) store.used.push(it.qi); });
  store.attempts.push({ score });
  save();
  renderResult(score);
}

/* ================= 结算 ================= */
function renderResult(score){
  const isLast = store.attempts.length >= MAX_ATTEMPTS;
  $('#r-score').textContent = score;
  $('#r-total').textContent = PER_ROUND;

  // 表情与评语
  let face, cap, sub;
  const pct = score / PER_ROUND;
  if(pct >= 0.9){ face = 'top';   cap = '二籍浓度爆表！'; sub = '这题库怕不是你出的吧 (๑•̀ㅂ•́)و✧'; }
  else if(pct >= 0.7){ face = 'top'; cap = '资深二籍！'; sub = '浓度很足，稳得很～'; }
  else if(pct >= 0.5){ face = 'mid'; cap = '合格的二籍～'; sub = '再刷一轮就能更高分啦'; }
  else if(pct >= 0.3){ face = 'mid'; cap = '还需修炼哦'; sub = '有些题目太刁钻了吧！'; }
  else { face = 'low'; cap = '唔…浓度告急'; sub = '别灰心，再来一次！'; }
  $('#r-avatar').textContent = FACE[face];
  $('#r-cap').textContent = cap;
  $('#r-sub').textContent = sub;

  // 三次成绩
  const box = $('#r-scores'); box.innerHTML = '';
  for(let i=0;i<MAX_ATTEMPTS;i++){
    const a = store.attempts[i];
    const d = document.createElement('div');
    d.className = 'score-item' + (a ? ' done' : '');
    d.innerHTML = `<div class="lbl">第 ${i+1} 次</div>
      <div class="num">${a ? a.score : '—'}${a ? '<span class="of">/10</span>' : ''}</div>`;
    box.appendChild(d);
  }

  // 全部答完 → 汇总
  const ft = $('#final-total');
  if(isLast){
    const scores = store.attempts.map(a=>a.score);
    const sum = scores.reduce((x,y)=>x+y,0);
    const best = Math.max(...scores);
    const avg = Math.round(sum / scores.length * 10) / 10;
    $('#f-sum').textContent = sum;
    $('#f-best').textContent = best;
    $('#f-avg').textContent = avg;
    ft.style.display = 'flex';
  }else{
    ft.style.display = 'none';
  }

  const btn = $('#btn-again');
  if(isLast){
    btn.disabled = true; btn.textContent = '三次机会已用完';
  }else{
    btn.disabled = false; btn.textContent = `开始第 ${store.attempts.length+1} 次答题`;
  }

  show('result');
}

/* ================= 事件 ================= */
$('#btn-start').addEventListener('click', startRound);
$('#btn-again').addEventListener('click', ()=>{ if(attemptsLeft()>0) startRound(); });
$('#btn-back-home').addEventListener('click', ()=>{ renderHome(); show('home'); });
$('#btn-home').addEventListener('click', ()=>{ renderHome(); show('home'); });
$('#btn-quit').addEventListener('click', ()=>{
  clearTimeout(round && round._t);
  renderHome(); show('home');
});
$('#btn-reset').addEventListener('click', ()=>{
  store = { attempts: [], used: [] }; save(); renderHome(); toast('记录已重置，三次机会回来了～');
});
$('#btn-howto-home').addEventListener('click', ()=>{
  toast('每轮随机 10 题 · 共 3 次机会 · 题目不重复');
});

/* 点空白处可提前进入下一题 */
document.addEventListener('click', (e)=>{
  if(!round || !round.answered) return;
  if($('#screen-quiz').classList.contains('hidden')) return;
  if(e.target.closest('.opt')) return;
  nextQuestion();
}, true);

/* ================= 启动 ================= */
load();
renderHome();
show('home');
</script>
</body>
