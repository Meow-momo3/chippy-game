<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#69babc">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>奇比井字棋 · 脑门棋盘</title>
<style>
  :root{
    --hair:#5cc2c6;          /* 奇比的薄荷青头发 */
    --hair-deep:#3aa2a7;
    --hair-dark:#2a8287;
    --cream:#fffdf6;         /* 奶油白外套 */
    --outfit:#eaf0d2;        /* 淡奶绿 */
    --bow:#e3525b;           /* 红蝴蝶结 */
    --bow-deep:#c93d49;
    --skin:#f7e6d5;
    --ink:#2c565b;
    --card:rgba(255,253,246,.94);
    --x-blue:#3f86d6;
    --o-red:#e0454f;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:linear-gradient(180deg,#7fd2d5 0%,#5cc2c6 45%,#4fb4ba 100%);
    color:var(--ink);
    font-family:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow:hidden;
    height:100dvh;
  }
  /* 背景漂浮的柔和泡泡/高光 */
  body::before{
    content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
    background:
      radial-gradient(circle at 12% 18%, rgba(255,255,255,.28) 0 26px, transparent 27px),
      radial-gradient(circle at 88% 12%, rgba(255,255,255,.22) 0 18px, transparent 19px),
      radial-gradient(circle at 78% 72%, rgba(255,255,255,.18) 0 30px, transparent 31px),
      radial-gradient(circle at 20% 80%, rgba(255,255,255,.16) 0 20px, transparent 21px),
      radial-gradient(circle at 52% 90%, rgba(255,255,255,.14) 0 14px, transparent 15px);
  }
  #app{position:relative;width:100%;height:100dvh;z-index:1;}

  /* ---------- Screens ---------- */
  .screen{
    position:absolute;inset:0;
    display:flex;flex-direction:column;
    align-items:center;justify-content:center;
    padding:18px;
    transition:opacity .35s ease;
  }
  .screen.hidden{opacity:0;pointer-events:none;}

  /* ---------- Start ---------- */
  #screen-start{justify-content:flex-end;padding-bottom:5dvh;}
  #screen-start .bgwrap{
    position:absolute;inset:0;display:flex;align-items:flex-start;justify-content:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 1dvh);
    pointer-events:none;
  }
  #screen-start .bg{
    width:min(96vw,78dvh);
    aspect-ratio:1/1;
    background-image:var(--img-start);
    background-size:cover;background-position:center;
    border-radius:30px;
    filter:drop-shadow(0 20px 40px rgba(35,90,95,.30));
    -webkit-mask:radial-gradient(120% 120% at 50% 50%, #000 66%, rgba(0,0,0,.55) 80%, transparent 84%);
    mask:radial-gradient(120% 120% at 50% 50%, #000 66%, rgba(0,0,0,.55) 80%, transparent 84%);
  }
  .hero-title{
    position:relative;z-index:2;
    margin:0 0 8px;
    font-size:clamp(34px,9vw,50px);
    font-weight:900;
    letter-spacing:.05em;
    color:#fff;
    text-shadow:0 3px 0 rgba(42,130,135,.35),0 10px 24px rgba(35,90,95,.30);
  }
  .hero-sub{
    position:relative;z-index:2;
    margin:0 0 22px;
    font-size:clamp(14px,3.6vw,17px);
    font-weight:600;
    color:#2c565b;
    background:rgba(255,253,246,.88);
    padding:6px 16px;border-radius:999px;
    box-shadow:0 6px 16px rgba(35,90,95,.16);
  }
  .menu-buttons{position:relative;z-index:2;display:flex;flex-direction:column;gap:15px;width:min(340px,88vw);}
  .btn{
    width:100%;
    border:0;cursor:pointer;
    font-family:inherit;
    font-size:clamp(18px,4.6vw,21px);
    font-weight:800;
    padding:17px 18px;
    border-radius:22px;
    color:var(--ink);
    background:var(--card);
    box-shadow:0 10px 22px rgba(35,90,95,.20),inset 0 -3px 0 rgba(42,130,135,.10);
    display:flex;align-items:center;justify-content:center;gap:12px;
    transition:transform .08s ease,box-shadow .15s ease;
  }
  .btn:active{transform:translateY(2px) scale(.99);box-shadow:0 5px 12px rgba(35,90,95,.20);}
  .btn .emoji{
    font-size:1.2em;line-height:1;
    width:34px;height:34px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.6);
  }
  .btn.primary{color:var(--hair-dark);background:linear-gradient(135deg,#eaf4d8,#f7f2e0);}
  .btn.primary .emoji{background:linear-gradient(135deg,var(--hair),var(--hair-deep));}
  .btn.local .emoji{background:linear-gradient(135deg,var(--bow),#f08a8f);}
  .btn.local{color:var(--bow-deep);}
  .linkbtn{
    position:relative;z-index:2;margin-top:6px;background:none;border:0;cursor:pointer;
    color:#f7fbfc;font-family:inherit;font-size:14px;font-weight:700;
    text-decoration:underline;padding:8px;text-shadow:0 1px 3px rgba(35,90,95,.35);
  }

  /* ---------- Difficulty ---------- */
  .panel{
    background:var(--card);
    border-radius:28px;
    padding:24px 22px 26px;
    width:min(380px,92vw);
    box-shadow:0 20px 48px rgba(35,90,95,.28);
    text-align:center;
    border:2px solid rgba(255,255,255,.7);
  }
  .panel h2{margin:0 0 4px;font-size:23px;font-weight:900;color:var(--hair-dark);}
  .panel p{margin:0 0 20px;font-size:14px;color:#5f8a8d;}
  .diff-buttons{display:flex;flex-direction:column;gap:13px;}
  .diffbtn{
    border:0;cursor:pointer;font-family:inherit;width:100%;
    padding:17px 18px;border-radius:20px;font-size:18px;font-weight:800;color:#fff;
    box-shadow:0 8px 18px rgba(0,0,0,.14),inset 0 -4px 0 rgba(0,0,0,.10);
    display:flex;align-items:center;justify-content:space-between;
    transition:transform .08s ease;
  }
  .diffbtn:active{transform:scale(.98);}
  .diffbtn small{font-size:12px;font-weight:700;opacity:.92;}
  .diff-easy{background:linear-gradient(135deg,#8fd3a8,#68c99a);}
  .diff-normal{background:linear-gradient(135deg,var(--hair),var(--hair-deep));}
  .diff-hard{background:linear-gradient(135deg,#e5766a,var(--bow-deep));}
  .backlink{
    margin-top:18px;background:none;border:0;cursor:pointer;font-family:inherit;
    color:var(--hair-deep);font-size:14px;font-weight:700;padding:8px;text-decoration:underline;
  }

  /* ---------- Game ---------- */
  #screen-game{justify-content:flex-start;padding:0;}
  .topbar{
    width:100%;display:flex;align-items:center;justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 10px) 14px 6px;
    gap:10px;
  }
  .iconbtn{
    border:0;cursor:pointer;font-family:inherit;
    background:rgba(255,253,246,.92);color:var(--hair-dark);
    width:46px;height:46px;border-radius:16px;font-size:20px;font-weight:800;
    box-shadow:0 5px 12px rgba(35,90,95,.16),inset 0 -2px 0 rgba(42,130,135,.10);
    display:flex;align-items:center;justify-content:center;
    transition:transform .08s ease;
  }
  .iconbtn:active{transform:scale(.92);}
  .match-chip{
    background:rgba(255,253,246,.92);border-radius:999px;padding:8px 16px;
    font-size:13px;font-weight:800;color:var(--hair-dark);box-shadow:0 5px 12px rgba(35,90,95,.14);
  }

  /* scoreboard */
  .scoreboard{
    display:flex;align-items:center;justify-content:center;gap:12px;
    width:100%;padding:2px 12px 10px;
  }
  .score-side{display:flex;align-items:center;gap:7px;padding:8px 13px;border-radius:16px;box-shadow:inset 0 -2px 0 rgba(0,0,0,.08);}
  .score-side .swatch{width:15px;height:15px;border-radius:5px;display:inline-block;box-shadow:inset 0 0 0 2px rgba(255,255,255,.55);}
  .score-side .name{font-size:13px;font-weight:800;color:#fff;}
  .score-side .num{font-size:20px;font-weight:900;color:#fff;}
  .score-x{background:linear-gradient(135deg,#5a9bdd,#3f86d6);}
  .score-o{background:linear-gradient(135deg,#ef7a80,#e0454f);}
  .score-draw{padding:8px 13px;border-radius:16px;background:rgba(255,253,246,.85);box-shadow:inset 0 -2px 0 rgba(42,130,135,.08);}
  .score-draw .name{font-size:13px;font-weight:800;color:#5f8a8d;}
  .score-draw .num{font-size:20px;font-weight:900;color:var(--hair-dark);}

  /* stage */
  #stage{
    position:relative;
    width:min(96vw,96dvh);
    aspect-ratio:1/1;
    margin-top:2px;
    flex:0 1 auto;
    border-radius:26px;
    background:var(--card);
    box-shadow:0 18px 40px rgba(35,90,95,.26),inset 0 0 0 4px rgba(255,255,255,.75);
    padding:5px;
    overflow:hidden;
  }
  #frame{
    position:absolute;inset:5px;border-radius:22px;overflow:hidden;
  }
  #face{
    position:absolute;inset:0;
    background-image:var(--img-start);
    background-size:cover;background-position:center;
    transition:background-image .25s ease;
  }
  #board{
    position:absolute;
    left:var(--bx);top:var(--by);
    width:var(--bw);height:var(--bh);
    z-index:3;
  }
  #gridlines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;}
  .cell{
    position:absolute;
    border:0;background:transparent;cursor:pointer;
    margin:0;padding:0;
    display:flex;align-items:center;justify-content:center;
    touch-action:manipulation;
    border-radius:14px;
  }
  .cell:active{background:rgba(92,194,198,.18);}
  .cell svg{width:100%;height:100%;display:block;overflow:visible;}
  .cell .mark{transform-box:fill-box;transform-origin:center;animation:pop .22s ease-out;}
  @keyframes pop{0%{transform:scale(0);}70%{transform:scale(1.15);}100%{transform:scale(1);}}

  /* turn banner */
  #turnbar{
    width:100%;padding:12px 12px calc(env(safe-area-inset-bottom,0px) + 16px);
    display:flex;align-items:center;justify-content:center;gap:8px;
  }
  #turnchip{
    background:var(--card);border-radius:999px;padding:12px 22px;
    font-size:15px;font-weight:800;color:var(--hair-dark);
    box-shadow:0 8px 18px rgba(35,90,95,.18),inset 0 -2px 0 rgba(42,130,135,.10);
    display:flex;align-items:center;gap:9px;
    transition:transform .2s ease;
  }
  #turnchip .dot{width:13px;height:13px;border-radius:50%;}
  #turnchip .spin{width:16px;height:16px;border:2px solid rgba(58,162,167,.25);border-top-color:var(--hair-dark);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}

  /* ---------- Result modal ---------- */
  #overlay{
    position:fixed;inset:0;z-index:50;
    display:flex;align-items:center;justify-content:center;
    background:rgba(30,80,84,.30);backdrop-filter:blur(2px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;
  }
  #overlay.show{opacity:1;pointer-events:auto;}
  .result-card{
    background:var(--card-solid,#fffdf6);border-radius:30px;width:min(344px,90vw);
    padding:26px 22px 24px;text-align:center;
    box-shadow:0 26px 60px rgba(35,90,95,.34);
    border:2px solid rgba(255,255,255,.85);
    transform:translateY(14px) scale(.96);transition:transform .3s cubic-bezier(.5,1.6,.4,1);
  }
  #overlay.show .result-card{transform:none;}
  .result-emoji{font-size:58px;line-height:1;margin:0 0 8px;}
  .result-title{font-size:27px;font-weight:900;color:var(--hair-dark);margin:0 0 4px;}
  .result-sub{font-size:14px;color:#5f8a8d;margin:0 0 20px;}
  .result-btns{display:flex;flex-direction:column;gap:12px;}
  .btn.again{color:var(--hair-dark);background:linear-gradient(135deg,#eaf4d8,#dff0ee);}
  .btn.menu{background:#eef4ef;color:var(--hair-deep);}

  /* how-to modal */
  #howto{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;
    background:rgba(30,80,84,.5);backdrop-filter:blur(4px);
    opacity:0;pointer-events:none;transition:opacity .3s ease;}
  #howto.show{opacity:1;pointer-events:auto;}
  .howto-card{background:var(--card-solid,#fffdf6);border-radius:24px;width:min(344px,90vw);padding:22px;
    box-shadow:0 26px 60px rgba(35,90,95,.32);color:#3b6266;border:2px solid rgba(255,255,255,.85);}
  .howto-card h3{margin:0 0 12px;font-size:21px;font-weight:900;color:var(--hair-dark);text-align:center;}
  .howto-card ul{margin:0 0 16px;padding-left:20px;font-size:14px;line-height:1.7;color:#3b6266;}
  .howto-card p{font-size:13px;color:#5f8a8d;margin:0 0 14px;text-align:center;}
  .howto-card b{color:var(--hair-dark);}

  /* ---------- 撒花/落花动画 ---------- */
  #confetti{
    position:fixed;inset:0;z-index:70;
    pointer-events:none;overflow:hidden;
    display:none;
  }
  #confetti.run{display:block;}
  .conf-piece{
    position:absolute;top:-6vh;
    border-radius:3px;
    opacity:0;
    animation:confFall linear forwards;
  }
  .conf-piece.circle{border-radius:50%;}
  .conf-piece.squish{width:11px;height:7px;}
  .conf-piece.tall{width:7px;height:12px;}
  @keyframes confFall{
    0%{opacity:0;transform:translateY(0) rotate(0deg) scale(1);}
    8%{opacity:1;}
    100%{opacity:1;transform:translateY(118vh) rotate(var(--sway,720deg)) scale(1);}
  }
  /* 失败时的低落动画：蓝灰色的落花缓慢飘落 + 轻微下坠 */
  #overlay.sad .result-card{animation:cardDrop .5s cubic-bezier(.3,1.4,.5,1);}
  @keyframes cardDrop{0%{transform:translateY(-14px) scale(1);}55%{transform:translateY(6px) scale(.98);}100%{transform:translateY(0) scale(1);}}
</style>
</head>
<body>
<div id="app">

  <!-- ===== Start ===== -->
  <section id="screen-start" class="screen">
    <div class="bgwrap"><div class="bg"></div></div>
    <h1 class="hero-title">奇比井字棋</h1>
    <div class="hero-sub">在奇比的脑门上下一局 ✕ ○</div>
    <div class="menu-buttons">
      <button class="btn primary" id="btn-ai"><span class="emoji">🤖</span> 人机对战</button>
      <button class="btn local" id="btn-local"><span class="emoji">🤝</span> 本地双人</button>
    </div>
    <button class="linkbtn" id="btn-howto">规则说明</button>
  </section>

  <!-- ===== Difficulty ===== -->
  <section id="screen-diff" class="screen hidden">
    <div class="panel">
      <h2>选择难度</h2>
      <p>奇比会认真陪你玩哦～</p>
      <div class="diff-buttons">
        <button class="diffbtn diff-easy" data-diff="easy">简单 <small>奇比有点迷糊</small></button>
        <button class="diffbtn diff-normal" data-diff="normal">普通 <small>旗鼓相当</small></button>
        <button class="diffbtn diff-hard" data-diff="hard">困难 <small>几乎无敌</small></button>
      </div>
      <button class="backlink" id="btn-back-diff">返回主菜单</button>
    </div>
  </section>

  <!-- ===== Game ===== -->
  <section id="screen-game" class="screen hidden">
    <div class="topbar">
      <button class="iconbtn" id="btn-quit" title="退出">←</button>
      <div class="match-chip" id="match-chip">人机·普通</div>
      <button class="iconbtn" id="btn-restart" title="重新开始">↻</button>
    </div>
    <div class="scoreboard">
      <div class="score-side score-x"><span class="swatch"></span><span class="name" id="name-x">蓝方</span><span class="num" id="score-x">0</span></div>
      <div class="score-draw"><span class="name">平</span><span class="num" id="score-draw">0</span></div>
      <div class="score-side score-o"><span class="swatch"></span><span class="name" id="name-o">红方</span><span class="num" id="score-o">0</span></div>
    </div>
    <div id="stage">
      <div id="frame">
        <div id="face"></div>
        <div id="board"></div>
      </div>
    </div>
    <div id="turnbar">
      <div id="turnchip"><span class="dot" id="turn-dot"></span><span id="turn-text">蓝方回合</span></div>
    </div>
  </section>

  <!-- ===== Result overlay ===== -->
  <div id="overlay">
    <div class="result-card">
      <div class="result-emoji" id="result-emoji">🎉</div>
      <h2 class="result-title" id="result-title">你赢了！</h2>
      <div class="result-sub" id="result-sub">超棒的！</div>
      <div class="result-btns">
        <button class="btn again" id="btn-again">再来一局</button>
        <button class="btn menu" id="btn-to-menu">返回主菜单</button>
      </div>
    </div>
  </div>

  <!-- ===== How to ===== -->
  <div id="howto">
    <div class="howto-card">
      <h3>怎么玩</h3>
      <ul>
        <li>棋盘就画在<b>奇比的脑门</b>上，点格子落子。</li>
        <li><b>蓝方 ✕</b> 先手，<b>红方 ○</b> 后手。</li>
        <li>先连成<b>横 / 竖 / 斜一条线</b>就赢啦！</li>
        <li>没人连成一线就是平局。</li>
      </ul>
      <p style="font-size:13px;text-align:center;color:#5c8386;">奇比的心情会跟着战况变化哦～</p>
      <button class="btn again" id="btn-close-howto" style="font-size:15px;">开始玩！</button>
    </div>
  </div>

  <!-- ===== 撒花/落花动画层 ===== -->
  <div id="confetti"></div>

</div>

<script>

document.documentElement.style.setProperty('--img-start', `url("${IMG.start}")`);

/* Grid region expressed as fractions of the square face (calibrated). */
const GRID = { x0:0.36, y0:0.235, x1:0.64, y1:0.46 };
function setGrid(){
  const bx = GRID.x0*100, by = GRID.y0*100, bw = (GRID.x1-GRID.x0)*100, bh=(GRID.y1-GRID.y0)*100;
  const st = document.documentElement.style;
  st.setProperty('--bx', bx+'%'); st.setProperty('--by', by+'%');
  st.setProperty('--bw', bw+'%'); st.setProperty('--bh', bh+'%');
}

/* ================= State ================= */
const $ = s => document.querySelector(s);
const WINLINES = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];

let mode='ai', difficulty='normal';
let board, current, gameOver=false;
let score={x:0,o:0,d:0};
let aiThinking=false;

const screens = {start:$('#screen-start'), diff:$('#screen-diff'), game:$('#screen-game')};
function show(name){
  Object.entries(screens).forEach(([k,el])=>el.classList.toggle('hidden', k!==name));
}

function faceTo(which){
  $('#face').style.backgroundImage = `url("${IMG[which]}")`;
}

/* ================= Rendering ================= */
function buildBoard(){
  const boardEl = $('#board');
  boardEl.innerHTML='';
  // grid lines
  const ln = document.createElementNS('http://www.w3.org/2000/svg','svg');
  ln.setAttribute('viewBox','0 0 100 100'); ln.setAttribute('id','gridlines');
  ln.setAttribute('preserveAspectRatio','none');
  const sw = '1.1';
  const col = 'rgba(60,86,90,0.62)';
  [[100/3,0,100/3,100],[200/3,0,200/3,100],[0,100/3,100,100/3],[0,200/3,100,200/3]].forEach(l=>{
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',l[0]);line.setAttribute('y1',l[1]);
    line.setAttribute('x2',l[2]);line.setAttribute('y2',l[3]);
    line.setAttribute('stroke',col);line.setAttribute('stroke-width',sw);
    line.setAttribute('stroke-linecap','round');
    ln.appendChild(line);
  });
  boardEl.appendChild(ln);

  // 9 cells
  const bw = GRID.x1-GRID.x0, bh = GRID.y1-GRID.y0;
  for(let i=0;i<9;i++){
    const row = Math.floor(i/3), col = i%3;
    // positions are fractions OF THE BOARD (which spans GRID.x0..x1, y0..y1)
    const cellW = 1/3, cellH = 1/3;
    const tapW = cellW*1.06, tapH = cellH*1.06;   // slightly expanded hit area
    const cx = (col+0.5)*cellW, cy = (row+0.5)*cellH;
    const cell = document.createElement('button');
    cell.className='cell empty'; cell.dataset.i=i;
    cell.style.left = ((cx - tapW/2)*100)+'%';
    cell.style.top  = ((cy - tapH/2)*100)+'%';
    cell.style.width = (tapW*100)+'%';
    cell.style.height= (tapH*100)+'%';
    cell.addEventListener('click', ()=>onCell(i));
    boardEl.appendChild(cell);
  }
}
function drawMark(cell, player){
  const ns='http://www.w3.org/2000/svg';
  const svg=document.createElementNS(ns,'svg');
  svg.setAttribute('viewBox','0 0 100 100');
  const g=document.createElementNS(ns,'g');
  g.setAttribute('class','mark');
  if(player==='x'){
    const back=document.createElementNS(ns,'path');
    back.setAttribute('d','M22,22 C46,44 56,58 80,80 M80,24 C58,44 46,58 22,78');
    back.setAttribute('fill','none'); back.setAttribute('stroke','rgba(255,255,255,0.9)');
    back.setAttribute('stroke-width',21); back.setAttribute('stroke-linecap','round');
    g.appendChild(back);
    const c=document.createElementNS(ns,'path');
    c.setAttribute('d','M22,22 C46,44 56,58 80,80 M80,24 C58,44 46,58 22,78');
    c.setAttribute('fill','none');
    c.setAttribute('stroke','var(--x-blue)');
    c.setAttribute('stroke-width',13);
    c.setAttribute('stroke-linecap','round');
    g.appendChild(c);
  }else{
    const back=document.createElementNS(ns,'ellipse');
    back.setAttribute('cx','50');back.setAttribute('cy','50');
    back.setAttribute('rx','28');back.setAttribute('ry','27');
    back.setAttribute('fill','none'); back.setAttribute('stroke','rgba(255,255,255,0.9)');
    back.setAttribute('stroke-width',21);
    g.appendChild(back);
    const c=document.createElementNS(ns,'ellipse');
    c.setAttribute('cx','50');c.setAttribute('cy','50');
    c.setAttribute('rx','28');c.setAttribute('ry','27');
    c.setAttribute('fill','none');
    c.setAttribute('stroke','var(--o-red)');
    c.setAttribute('stroke-width',13);
    g.appendChild(c);
  }
  svg.appendChild(g);
  cell.innerHTML=''; cell.appendChild(svg);
  cell.classList.remove('empty'); cell.classList.add('filled');
}

/* ================= Game logic ================= */
function startGame(m,diff){
  mode=m; difficulty=diff||difficulty;
  board=Array(9).fill(null);
  current='x'; gameOver=false; aiThinking=false;
  score={x:0,o:0,d:0};
  buildBoard();
  updateScoreUI();
  faceTo('start');
  setMatchChip();
  show('game');
  updateTurn();
}
function resetRound(){
  board=Array(9).fill(null);
  current='x'; gameOver=false; aiThinking=false;
  buildBoard();
  faceTo('start');
  updateTurn();
}
function winner(b){
  for(const [a,c,d] of WINLINES){
    if(b[a] && b[a]===b[c] && b[a]===b[d]) return {p:b[a], line:[a,c,d]};
  }
  return null;
}
function onCell(i){
  if(gameOver||aiThinking) return;
  if(board[i]) return;
  if(mode==='ai'){
    if(current!=='x') return; // 人机模式：玩家永远蓝方，只在蓝色回合响应
    play(i,'x');
  }else{
    play(i, current); // 本地对战：按当前回合方的棋子落子
  }
}
let sparkleTimer=null;
function flashSparkle(){
  faceTo('sparkle');
  clearTimeout(sparkleTimer);
  sparkleTimer=setTimeout(()=>{ if(!gameOver) faceTo('start'); }, 350);
}
function play(i, player){
  board[i]=player;
  const cell=document.querySelector(`.cell[data-i="${i}"]`);
  if(cell) drawMark(cell,player);
  playTone(player);
  const w=winner(board);
  if(w){ endRound(w); return; }
  if(board.every(Boolean)){ endRound(null); return; }
  // 人机模式：只有玩家(蓝方✕)落子才闪星星眼；奇比(○)落子不闪，保持露额头
  if(mode==='ai' && player==='o'){
    // 奇比的回合：保持开始.png，不闪星星眼
  }else{
    flashSparkle();   // 玩家落子：星星眼，随后恢复开始(露额头)
  }
  nextTurn();
}
function nextTurn(){
  current = (current==='x')?'o':'x';
  updateTurn();
  if(mode==='ai' && current==='o'){
    scheduleAi();
  }
}
function scheduleAi(){
  aiThinking=true;
  // 思考时保持开始.png（露着大额头），不再切换成准备.png
  const delay = {easy:520, normal:640, hard:720}[difficulty] + Math.random()*180;
  window.__aiT = setTimeout(()=>{
    // stale guard: only act if still playing a human-vs-AI game
    if(!aiThinking || mode!=='ai' || gameOver) return;
    const mv = aiMove(board.slice());
    aiThinking=false;
    if(mv>=0) play(mv,'o');
  }, delay);
}

/* ---- AI ---- */
function aiMove(b){
  const empties = b.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(!empties.length) return -1;
  if(difficulty==='easy'){
    // mostly random, occasionally takes a win
    if(Math.random()<0.5){ const win = findWin(b,'o'); if(win!=null) return win; }
    return empties[Math.floor(Math.random()*empties.length)];
  }
  if(difficulty==='normal'){
    const win = findWin(b,'o'); if(win!=null) return win;
    const block = findWin(b,'x'); if(block!=null) return block;
    if(!b[4]) return 4;
    const corners=[0,2,6,8].filter(i=>!b[i]);
    if(corners.length) return corners[Math.floor(Math.random()*corners.length)];
    return empties[Math.floor(Math.random()*empties.length)];
  }
  // hard: minimax (unbeatable)
  return bestMove(b,'o');
}
function findWin(b,p){
  for(const [a,c,d] of WINLINES){
    const line=[b[a],b[c],b[d]];
    if(line.filter(v=>v===p).length===2 && line.includes(null)){
      return [a,c,d].find(i=>b[i]===null);
    }
  }
  return null;
}
function bestMove(b, me){
  let bestScore=-Infinity, move=null;
  for(let i=0;i<9;i++){
    if(b[i]) continue;
    b[i]=me;
    const s=minimax(b, me==='x'?'o':'x', me);
    b[i]=null;
    if(s>bestScore){bestScore=s;move=i;}
  }
  return move;
}
function minimax(b, turn, me){
  const w=winner(b);
  if(w) return w.p===me ? 10 : -10;
  if(b.every(Boolean)) return 0;
  const empty=b.map((v,i)=>v?null:i).filter(v=>v!==null);
  if(turn===me){
    let best=-Infinity;
    for(const i of empty){ b[i]=turn; best=Math.max(best,minimax(b, turn==='x'?'o':'x', me)); b[i]=null; }
    return best;
  }else{
    let best=Infinity;
    for(const i of empty){ b[i]=turn; best=Math.min(best,minimax(b, turn==='x'?'o':'x', me)); b[i]=null; }
    return best;
  }
}

/* ---- Round end ---- */
let lastWinFace = 'sparkle'; // alternate between 星星眼 and 笑 for variety
function winFace(){
  lastWinFace = (lastWinFace==='sparkle') ? 'win' : 'sparkle';
  return lastWinFace;
}
function endRound(w){
  gameOver=true;
  let emoji,title,sub,face,outcome; // outcome: 'win' | 'lose' | 'draw'
  if(!w){
    score.d++;
    emoji='🤝'; title='平局'; sub='不分胜负，再来一局！'; face='win'; outcome='draw';
  }else if(mode==='ai'){
    if(w.p==='x'){ score.x++; emoji='🎉'; title='你赢了！'; sub='奇比输得心服口服～'; face=winFace(); outcome='win'; }
    else{ score.o++; emoji='🥲'; title='你输了'; sub='别灰心，再试一次！'; face='lose'; outcome='lose'; }
  }else{
    // local: mark winner
    if(w.p==='x'){ score.x++; emoji='🎉'; title='蓝方获胜！'; sub='蓝方 ✕ 真的好强！'; face=winFace(); outcome='win'; }
    else{ score.o++; emoji='🎉'; title='红方获胜！'; sub='红方 ○ 笑到最后！'; face=winFace(); outcome='win'; }
  }
  updateScoreUI();
  faceTo(face);
  $('#result-emoji').textContent=emoji;
  $('#result-title').textContent=title;
  $('#result-sub').textContent=sub;
  // 撒花动画：赢=彩色纸片，输=蓝灰落花(低落)，平局不撒
  if(outcome==='win'){           confettiRain('win');   }
  else if(outcome==='lose'){     confettiRain('lose');  }
  setTimeout(()=>{
    const ov=$('#overlay');
    ov.classList.toggle('sad', outcome==='lose');
    ov.classList.add('show');
  }, 320);
  if(outcome==='win') winTone();
  else if(outcome==='lose') loseTone();
  else winTone();
}

function updateScoreUI(){
  $('#score-x').textContent=score.x;
  $('#score-o').textContent=score.o;
  $('#score-draw').textContent=score.d;
}

/* ---- Turn banner ---- */
function updateTurn(){
  const chip=$('#turnchip'), dot=$('#turn-dot'), txt=$('#turn-text');
  if(aiThinking){
    chip.innerHTML='<span class="spin"></span><span>奇比思考中…</span>';
    return;
  }
  if(mode==='ai'){
    if(current==='x'){
      dot.style.background='var(--x-blue)';
      chip.innerHTML='<span class="dot" style="background:var(--x-blue)"></span><span>你的回合 · 落一个 ✕</span>';
    }else{
      chip.innerHTML='<span class="dot" style="background:var(--o-red)"></span><span>等待奇比…</span>';
    }
  }else{
    if(current==='x'){
      dot.style.background='var(--x-blue)';
      chip.innerHTML='<span class="dot" style="background:var(--x-blue)"></span><span>蓝方回合 · 点脑门落 ✕</span>';
    }else{
      dot.style.background='var(--o-red)';
      chip.innerHTML='<span class="dot" style="background:var(--o-red)"></span><span>红方回合 · 点脑门落 ○</span>';
    }
  }
}

function setMatchChip(){
  const labels={easy:'人机·简单', normal:'人机·普通', hard:'人机·困难'};
  $('#match-chip').textContent = mode==='ai' ? labels[difficulty] : '本地双人';
  $('#name-x').textContent = mode==='ai' ? '你(蓝)' : '蓝方';
  $('#name-o').textContent = mode==='ai' ? '奇比(红)' : '红方';
}

/* ================= Audio (WebAudio, self-contained) ================= */
let actx=null, soundOn=true;
function tone(freq, dur, type='sine', vol=0.16, when=0){
  if(!soundOn) return;
  try{
    if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)();
    const o=actx.createOscillator(), g=actx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0, actx.currentTime+when);
    g.gain.linearRampToValueAtTime(vol, actx.currentTime+when+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime+when+dur);
    o.connect(g); g.connect(actx.destination);
    o.start(actx.currentTime+when); o.stop(actx.currentTime+when+dur+0.02);
  }catch(e){}
}
function playTone(p){ if(p==='x'){tone(460,0.12,'triangle');tone(560,0.10,'triangle',0.12,0.03);} else {tone(330,0.12,'sine');tone(392,0.10,'sine',0.12,0.03);} }
function winTone(){ tone(523,0.16,'triangle'); tone(659,0.16,'triangle',0.16,0.12); tone(784,0.22,'triangle',0.16,0.24); }
function loseTone(){ tone(392,0.18,'sine'); tone(311,0.18,'sine',0.14,0.16); tone(247,0.30,'sine',0.14,0.32); }

/* ================= 撒花/落花动画 ================= */
let confettiTimer=null;
function confettiRain(kind){
  const box=$('#confetti');
  if(!box) return;
  box.innerHTML='';
  box.classList.remove('run');
  void box.offsetWidth; // restart animation
  box.classList.add('run');

  const win = (kind==='win');
  const N = win ? 46 : 30;
  const palette = win
    ? ['#ff8fb3','#ffd166','#6ee7b7','#7dd3fc','#c4b5fd','#fda4af','#a7f3d0','#fcd34d']
    : ['#a9c3c9','#8faeb5','#7b9aa2','#9fb4ba','#b8ccd1','#87a7af'];
  for(let i=0;i<N;i++){
    const p=document.createElement('i');
    p.className='conf-piece' + (Math.random()<0.25?' circle':'') + (Math.random()<0.4?' squish':' tall');
    p.style.left = (Math.random()*100)+'%';
    p.style.width  = win ? (7+Math.random()*7)+'px' : (6+Math.random()*5)+'px';
    p.style.height = p.style.width;
    if(p.classList.contains('squish')) p.style.height=(parseFloat(p.style.width)*0.6)+'px';
    p.style.background = palette[Math.floor(Math.random()*palette.length)];
    const dur = win ? (2.4+Math.random()*1.8) : (3.6+Math.random()*2.0);
    const delay = win ? Math.random()*0.6 : Math.random()*0.9;
    p.style.animationDuration = dur+'s';
    p.style.animationDelay = delay+'s';
    p.style.setProperty('--sway', (Math.random()<0.5?-1:1)*(380+Math.random()*500)+'deg');
    box.appendChild(p);
  }
  clearTimeout(confettiTimer);
  confettiTimer = setTimeout(()=>{ box.classList.remove('run'); box.innerHTML=''; }, 6500);
}

/* ================= Wiring ================= */
$('#btn-ai').addEventListener('click', ()=>{ resumeAudio(); show('diff'); });
$('#btn-local').addEventListener('click', ()=>{ resumeAudio(); startGame('local'); });
$('#btn-back-diff').addEventListener('click', ()=>show('start'));
document.querySelectorAll('.diffbtn').forEach(b=>{
  b.addEventListener('click', ()=>{ startGame('ai', b.dataset.diff); });
});
$('#btn-restart').addEventListener('click', ()=>{ resetRound(); });
$('#btn-quit').addEventListener('click', ()=>{ if(aiThinking){aiThinking=false;clearTimeout(window.__aiT);} show('start'); });
$('#btn-again').addEventListener('click', ()=>{ const ov=$('#overlay'); ov.classList.remove('show','sad'); resetRound(); });
$('#btn-to-menu').addEventListener('click', ()=>{ const ov=$('#overlay'); ov.classList.remove('show','sad'); show('start'); });
$('#btn-howto').addEventListener('click', ()=>$('#howto').classList.add('show'));
$('#btn-close-howto').addEventListener('click', ()=>$('#howto').classList.remove('show'));

function resumeAudio(){
  try{ if(!actx) actx=new (window.AudioContext||window.webkitAudioContext)(); if(actx.state==='suspended') actx.resume(); }catch(e){}
}

/* setup grid var & initial */
setGrid();
// Ensure start screen shows the face; default visible.
show('start');
